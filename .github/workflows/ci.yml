name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      # The gbrain commit this pack is verified against (gbrain 0.50.0.0).
      GBRAIN_REF: a6be012
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.12

      - name: Unit tests
        run: bun run test

      - name: Lint the sample brain
        run: bun run lint:sample

      - name: The published action lints the sample brain
        uses: ./
        with:
          path: fixtures/sample-brain

      - name: Install gbrain
        run: |
          git clone https://github.com/garrytan/gbrain.git "$RUNNER_TEMP/gbrain"
          git -C "$RUNNER_TEMP/gbrain" checkout "$GBRAIN_REF"
          (cd "$RUNNER_TEMP/gbrain" && bun install --frozen-lockfile)
          mkdir -p "$RUNNER_TEMP/bin"
          printf '#!/bin/bash\nexec bun run %s/gbrain/src/cli.ts "$@"\n' "$RUNNER_TEMP" > "$RUNNER_TEMP/bin/gbrain"
          chmod +x "$RUNNER_TEMP/bin/gbrain"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"

      - name: Skillpack doctor must score 10/10
        run: |
          export GBRAIN_HOME="$RUNNER_TEMP/home"
          gbrain skillpack doctor . --json | tee doctor.json
          jq -e '.score == .max_score' doctor.json

      - name: End-to-end against a real gbrain
        run: bun run test:e2e --timeout 300000

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: gitleaks
        run: |
          curl -sSL https://github.com/gitleaks/gitleaks/releases/download/v8.24.2/gitleaks_8.24.2_linux_x64.tar.gz | tar -xz gitleaks
          ./gitleaks detect --source . --redact --verbose
